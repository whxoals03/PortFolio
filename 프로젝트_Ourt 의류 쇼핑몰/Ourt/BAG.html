<!DOCTYPE html>
<html lang="ko">
<head>

    <meta charset="UTF-8">

    <title>Ourt - Shopping Bag</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            height: 80px;

            display: flex;
            align-items: center;

            padding: 0 50px;

            position: relative;
        }


        .logo {
            width: 250px;

            font-family: Georgia, serif;

            font-size: 30px;
            letter-spacing: 9px;

            color: black;
            text-decoration: none;
        }


        .main-menu {
            list-style: none;

            display: flex;

            gap: 38px;

            position: absolute;

            left: 50%;

            transform: translateX(-50%);
        }


        .main-menu a {
            color: #444;

            text-decoration: none;

            font-size: 12px;

            letter-spacing: 5px;

            white-space: nowrap;
        }


        .right-menu {
            margin-left: auto;

            list-style: none;

            display: flex;

            gap: 25px;
        }


        .right-menu a {
            color: #444;

            text-decoration: none;

            font-size: 11px;

            white-space: nowrap;
        }



        /* =========================
           BAG
        ========================= */

        .bag-container {

            width: 83%;

            margin: 100px auto;

        }


        .bag-title {

            text-align: center;

            font-size: 17px;

            letter-spacing: 8px;

            margin-bottom: 50px;

        }



        /* 배송 탭 */

        .bag-tabs {

            height: 48px;

            display: flex;

            border: 1px solid #777;

            margin-bottom: 20px;

        }


        .tab {

            width: 200px;

            border: none;

            border-right: 1px solid #777;

            background: white;

        }


        .tab.active {

            background: black;

            color: white;

            font-weight: bold;

        }



        /* 장바구니 테이블 */

        .cart-table {

            width: 100%;

            border-collapse: collapse;

        }


        .cart-table th {

            height: 45px;

            font-size: 12px;

            border-top: 1px solid #999;

            border-bottom: 1px solid #999;

        }


        .cart-table td {

            padding: 15px 10px;

            text-align: center;

            border-bottom: 1px solid #bbb;

        }


        .cart-image {

            width: 90px;
            height: 110px;

            object-fit: cover;

            object-position: top;

        }


        .product-info {

            text-align: left !important;

            font-size: 13px;

        }


        .product-info strong {

            display: block;

            margin-bottom: 10px;

        }


        .quantity {

            width: 50px;

            padding: 5px;

        }


        .change-button {

            margin-left: 5px;

            padding: 5px 10px;

            background: white;

            border: 1px solid #aaa;

            cursor: pointer;

        }



        /* 상품 없을 때 */

        .empty {

            height: 160px;

            text-align: center;

            font-weight: bold;

        }



        /* 버튼라인 */

        .cart-control {

            margin-top: 15px;

            display: flex;

            justify-content: space-between;

        }


        button {

            cursor: pointer;

        }


        .white-button {

            padding: 10px 15px;

            border: 1px solid #777;

            background: white;

        }



        /* 금액 */

        .summary {

            margin-top: 50px;

            border: 1px solid #aaa;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

        }


        .summary-box {

            text-align: center;

            padding: 30px;

        }


        .summary-box h3 {

            font-size: 13px;

            margin-bottom: 25px;

        }


        .summary-box strong {

            font-size: 23px;

        }



        /* 밑 버튼 */

        .bottom-buttons {

            margin-top: 20px;

            display: flex;

            justify-content: space-between;

        }


        .order-buttons {

            display: flex;

            gap: 8px;

        }


        .black-button {

            background: black;

            color: white;

            border: 1px solid black;

            padding: 10px 15px;

        }

        /* ONLINE STORE 하위 메뉴 */
        .store-panel {
            position: absolute;

            top: 80px;
            left: 0;

            width: 100%;
            height: 85px;

            background-color: rgba(255, 255, 255, 0.9);

            display: none;

            z-index: 1000;
        }


        /* 메뉴 활성화 */
        .store-panel.show {
            display: block;
        }


        /* 카테고리 */
        .category-menu {
            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 38px;
        }


        /* 카테고리 글씨 */
        .category-menu a {
            color: #333;

            text-decoration: none;

            font-size: 12px;
            letter-spacing: 4px;

            white-space: nowrap;
        }


        /* 카테고리에 마우스를 올렸을 때 */
        .category-menu a:hover {
            color: black;
            font-weight: bold;
        }

    </style>

</head>


<body>


<header class="header">


    <a
        href="Ourt.html"
        class="logo">

        Ourt

    </a>


    <ul class="main-menu">

        <li>
            <a href="Ourt.html">
                HOME
            </a>
        </li>

        <li>
            <a href="#">
                ABOUT
            </a>
        </li>

        <li>
            <a href="#" id="online-store-menu">ONLINE STORE</a>
        </li>

        <li>
            <a href="#">
                COMMUNITY
            </a>
        </li>

        <li>
            <a href="#">
                CONTACT
            </a>
        </li>

    </ul>


    <ul class="right-menu">

        <li>
            <a href="#">
                LOGIN
            </a>
        </li>

        <li>

            <a href="BAG.html">

                SHOPPING BAG
                (<span id="bag-count">0</span>)

            </a>

        </li>

        <li>
            <a href="#">
                MY PAGE
            </a>
        </li>

        <li>
            <a href="#">
                COUPON
            </a>
        </li>

    </ul>

    <!-- ONLINE STORE 하위 메뉴 -->
    <div class="store-panel" id="store-panel">

        <div class="category-menu">

            <a href="#">NEW ARRIVALS</a>
            <a href="#">COAT</a>
            <a href="#">JACKET</a>
            <a href="#">CARDIGAN</a>
            <a href="#">KNIT</a>
            <a href="#">T-SHIRTS</a>

            <a href="SHIRTS.html">SHIRTS</a>

            <a href="#">PANTS</a>
            <a href="#">DENIM</a>
            <a href="#">SHOES</a>
            <a href="#">ACCESSORY</a>

        </div>

    </div>

</header>



<main class="bag-container">


    <h2 class="bag-title">
        장바구니
    </h2>



    <div class="bag-tabs">

        <button class="tab active">

            국내배송상품
            (<span id="domestic-count">0</span>)

        </button>


        <button class="tab">

            해외배송상품 (0)

        </button>

    </div>



    <table class="cart-table">


        <thead>

            <tr>

                <th>
                    선택
                </th>

                <th>
                    이미지
                </th>

                <th>
                    상품정보
                </th>

                <th>
                    판매가
                </th>

                <th>
                    수량
                </th>

                <th>
                    배송비
                </th>

                <th>
                    합계
                </th>

            </tr>

        </thead>



        <tbody id="cart-body">

        </tbody>


    </table>



    <div class="cart-control">


        <button
            class="white-button"
            onclick="deleteSelected()">

            선택상품 삭제

        </button>


        <button
            class="white-button"
            onclick="clearBag()">

            장바구니 비우기

        </button>


    </div>



    <!-- 금액 -->

    <div class="summary">


        <div class="summary-box">

            <h3>
                총 상품금액
            </h3>

            <strong id="total-product">
                0원
            </strong>

        </div>



        <div class="summary-box">

            <h3>
                총 배송비
            </h3>

            <strong>
                + 0원
            </strong>

        </div>



        <div class="summary-box">

            <h3>
                결제예정금액
            </h3>

            <strong id="final-price">
                0원
            </strong>

        </div>


    </div>



    <div class="bottom-buttons">


        <button
            class="white-button"
            onclick="location.href='SHIRTS.html'">

            쇼핑계속하기

        </button>



        <div class="order-buttons">


            <button
                class="white-button"
                onclick="orderSelected()">

                선택상품주문

            </button>


            <button
                class="black-button"
                onclick="orderAll()">

                전체상품주문

            </button>


        </div>


    </div>


</main>


<script src="BAG.js"></script>

</body>
</html>

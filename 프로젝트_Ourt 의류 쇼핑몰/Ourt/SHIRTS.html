<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ourt - Shirts</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            color: #222;
        }



        /* =========================
           상단 메뉴
        ========================= */

        .header {

            width: 100%;
            height: 80px;

            display: flex;
            align-items: center;

            padding: 0 50px;

            background-color: white;

            position: relative;

            z-index: 1000;
        }



        /* 왼쪽 Ourt 로고 */

        .logo {

            width: 250px;

            font-family: Georgia, serif;

            font-size: 30px;

            letter-spacing: 9px;

            color: black;

            text-decoration: none;
        }



        /* 가운데 메뉴 */

        .main-menu {

            list-style: none;

            display: flex;
            align-items: center;

            gap: 38px;

            position: absolute;

            left: 50%;

            transform: translateX(-50%);
        }


        .main-menu a {

            color: #444;

            text-decoration: none;

            font-size: 12px;

            letter-spacing: 5px;

            white-space: nowrap;
        }


        .main-menu a:hover {

            color: black;
        }



        /* 오른쪽 메뉴 */

        .right-menu {

            margin-left: auto;

            list-style: none;

            display: flex;
            align-items: center;

            gap: 25px;
        }


        .right-menu a {

            color: #444;

            text-decoration: none;

            font-size: 11px;

            white-space: nowrap;
        }


        .right-menu a:hover {

            color: black;
        }


        .menu-button {

            border: none;

            background: none;

            font-size: 18px;

            cursor: pointer;
        }



        /* =========================
           ONLINE STORE 하위 메뉴
        ========================= */

        .store-panel {

            position: absolute;

            top: 80px;
            left: 0;

            width: 100%;
            height: 85px;

            background-color:
                rgba(255, 255, 255, 0.93);

            display: none;

            z-index: 2000;

            border-top:
                1px solid #f5f5f5;

            border-bottom:
                1px solid #eeeeee;
        }


        .store-panel.show {

            display: block;
        }


        .category-menu {

            width: 100%;
            height: 100%;

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 38px;
        }


        .category-menu a {

            color: #333;

            text-decoration: none;

            font-size: 12px;

            letter-spacing: 4px;

            white-space: nowrap;
        }


        .category-menu a:hover {

            color: black;

            font-weight: bold;
        }



        /* =========================
           상품 목록
        ========================= */

        .product-grid {

            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);
        }


        .product-card {

            position: relative;

            overflow: hidden;

            color: black;

            text-decoration: none;

            border-right:
                1px solid #eee;

            cursor: pointer;
        }



        /* =========================
           상품 이미지
        ========================= */

        .product-image {
            width: 100%;
            height: 600px;

            overflow: hidden;

            background-color: #eee;
        }


        .product-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            object-position: center top;

            display: block;
        }



        /* =========================
           상품 Hover 정보
        ========================= */

        .hover-info {

            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;

            padding: 25px 30px;

            background-color:
                rgba(255, 255, 255, 0.90);

            transform:
                translateY(100%);

            transition:
                transform 0.3s ease;
        }


        .product-card:hover .hover-info {

            transform:
                translateY(0);
        }


        .hover-info h2 {

            font-size: 17px;

            font-weight: 500;

            line-height: 1.5;

            margin-bottom: 12px;
        }


        .hover-info .brand {

            font-size: 13px;

            margin-bottom: 10px;
        }


        .price-area {

            margin-top: 8px;

            font-size: 17px;
        }


        .discount {

            color: red;

            font-weight: bold;

            margin-right: 7px;
        }


        .price {

            font-weight: bold;
        }


        .review {

            margin-top: 10px;

            font-size: 13px;

            color: #777;
        }



        /* =========================
           반응형
        ========================= */

        @media screen and
        (max-width: 1100px) {

            .main-menu {

                display: none;
            }


            .product-grid {

                grid-template-columns:
                    1fr;
            }


            .category-menu {

                gap: 15px;
            }


            .category-menu a {

                font-size: 10px;

                letter-spacing: 2px;
            }
        }

    </style>

</head>

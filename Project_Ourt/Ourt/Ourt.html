<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ourt</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: #222;
        }

        /* 맨 위 검은 쿠폰 안내바 */
        .coupon-bar {
            width: 100%;
            height: 38px;

            background-color: black;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 13px;
        }

        /* 흰색 메뉴 영역 */
        .header {
            width: 100%;
            height: 80px;

            background-color: rgba(255, 255, 255, 0.96);

            display: flex;
            align-items: center;

            padding: 0 55px;

            position: relative;
            z-index: 10;
        }

        /* 왼쪽 로고 */
        .logo {
            width: 250px;

            font-family: Georgia, serif;
            font-size: 30px;
            letter-spacing: 9px;

            text-decoration: none;
            color: black;
        }

        /* 가운데 메뉴 */
        .main-menu {
            display: flex;
            align-items: center;
            gap: 38px;

            list-style: none;

            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .main-menu a {
            color: #444;
            text-decoration: none;

            font-size: 12px;
            letter-spacing: 5px;

            white-space: nowrap;
        }

        .main-menu a:hover {
            color: black;
        }

        /* 오른쪽 메뉴 */
        .right-menu {
            margin-left: auto;

            display: flex;
            align-items: center;
            gap: 27px;

            list-style: none;
        }

        .right-menu a {
            text-decoration: none;
            color: #444;

            font-size: 11px;

            white-space: nowrap;
        }

        .right-menu a:hover {
            color: black;
        }

        /* 햄버거 버튼 */
        .menu-button {
            border: none;
            background: none;

            font-size: 18px;

            cursor: pointer;
        }

        /* 메인 이미지 */
        .hero {
            width: 100%;
            height: calc(100vh - 118px);

            background-image: url("pic/Ourt.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            position: relative;
        }

        /* 메인 이미지 아래 중앙 로고 */
        .hero-text {
            position: absolute;

            left: 50%;
            bottom: 55px;

            transform: translateX(-50%);

            text-align: center;
            color: white;
        }

        .hero-text h1 {
            font-family: Georgia, serif;

            font-size: 30px;
            font-weight: normal;

            letter-spacing: 12px;

            margin-bottom: 9px;
        }

        .hero-text p {
            font-family: Georgia, serif;

            font-size: 8px;
            letter-spacing: 2px;
        }

        /* 화면이 작아졌을 때 */
        @media screen and (max-width: 1100px) {

            .main-menu {
                display: none;
            }

            .right-menu li:nth-child(1),
            .right-menu li:nth-child(2),
            .right-menu li:nth-child(3),
            .right-menu li:nth-child(4) {
                display: none;
            }
        }

        /* ONLINE STORE 드롭다운 */
        .store-panel {
            position: absolute;

            top: 80px;
            left: 0;

            width: 100%;
            height: 85px;

            background-color: rgba(255, 255, 255, 0.88);

            display: none;

            z-index: 100;
        }

        /* 드롭다운 표시 */
        .store-panel.show {
            display: block;
        }

        /* 카테고리 메뉴 */
        .category-menu {
            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 38px;
        }

        /* 카테고리 글자 */
        .category-menu a {
            text-decoration: none;
            color: #333;

            font-size: 12px;
            letter-spacing: 4px;

            white-space: nowrap;
        }

        .category-menu a:hover {
            color: black;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <!-- 쿠폰 안내 -->
    <div class="coupon-bar">
        Ourt 카카오 채널 추가 5% 쿠폰 혜택
    </div>


    <!-- 상단 메뉴 -->
    <header class="header">

        <!-- 왼쪽 로고 -->
        <a href="Ourt.html" class="logo">
            Ourt
        </a>


        <!-- 가운데 메뉴 -->
        <ul class="main-menu">
            <li><a href="Ourt.html">HOME</a></li>
            <li><a href="#">ABOUT</a></li>
            <li><a href="#" id="online-store-menu">ONLINE STORE</a></li>
            <li><a href="#">COMMUNITY</a></li>
            <li><a href="#">CONTACT</a></li>
        </ul>


        <!-- 오른쪽 메뉴 -->
        <ul class="right-menu">

            <li>
                <a href="#">LOGIN</a>
            </li>

            <li>
                <a href="BAG.html">SHOPPING BAG (0)</a>
            </li>

            <li>
                <a href="#">MY PAGE</a>
            </li>

            <li>
                <a href="#">COUPON</a>
            </li>

            <li>
                <button class="menu-button">
                    ☰
                </button>
            </li>

        </ul>

        <!-- ONLINE STORE 드롭다운 -->
        <div class="store-panel" id="store-panel">

            <div class="category-menu">
                <a href="#">NEW ARRIVALS</a>
                <a href="#">COAT</a>
                <a href="#">JACKET</a>
                <a href="#">CARDIGAN</a>
                <a href="#">KNIT</a>
                <a href="#">T-SHIRTS</a>
                <a href="SHIRTS.html">SHIRTS</a>
                <a href="#">PANTS</a>
                <a href="#">DENIM</a>
                <a href="#">SHOES</a>
                <a href="#">ACCESSORY</a>
            </div>

        </div>

    </header>

    


    <!-- 메인 이미지 -->
    <main class="hero">

        <div class="hero-text">
            <h1>Ourt</h1>
            <p>FOR MAN</p>
        </div>

    </main>


    <!-- JavaScript 연결 -->
    <script src="Ourt.js"></script>

</body>
</html>
